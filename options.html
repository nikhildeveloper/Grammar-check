<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Input Detector – Options</title>
  <style>
    body { font: 14px system-ui, -apple-system, Segoe UI, Roboto; padding: 24px; max-width: 780px; }
    fieldset { border: 1px solid #ddd; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    label { display: block; margin: 8px 0 4px; }
    input[type="text"], input[type="password"] { width: 100%; padding: 8px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button { padding: 8px 12px; border-radius: 8px; border: 1px solid #ccc; background: #fafafa; cursor: pointer; }
  </style>
</head>
<body>
  <h2>Grammar Check Settings</h2>

  <fieldset>
    <legend>Mode</legend>
    <label><input type="radio" name="apiMode" value="proxy"> Use my API proxy (recommended)</label>
    <div id="proxyFields" style="margin:8px 0 0 22px;">
      <label>Proxy URL (POST):</label>
      <input id="apiUrl" type="text" placeholder="https://your-server.example/grammar" />
    </div>
    <label style="margin-top:12px;"><input type="radio" name="apiMode" value="openai"> Use OpenAI directly</label>
    <div id="openaiFields" style="margin:8px 0 0 22px;">
      <label>OpenAI API Key:</label>
      <input id="apiKey" type="password" placeholder="sk-..." />
      <label>Model (default: gpt-4o-mini)</label>
      <input id="model" type="text" placeholder="gpt-4o-mini" />
    </div>
  </fieldset>

  <div class="row">
    <button id="save">Save</button>
    <button id="reset">Reset to Mock</button>
  </div>

  <!-- MV3 requires external scripts, not inline -->
  <script src="options.js"></script>
</body>
</html>
